name: notes

services:
  # Own PostgreSQL, separate from any other project on the server.
  # Named notes-db (not "db") so it can never be confused with another project's database.
  notes-db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: notesapp
    volumes:
      - pgdata:/var/lib/postgresql
    mem_limit: 384m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notesapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${NOTES_PORT:-4210}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: notes-db
      DB_PORT: 5432
      DB_USER: notes
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: notesapp
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      FAULTLINE_API_KEY: ${FAULTLINE_API_KEY:-}
      FAULTLINE_ENDPOINT: ${FAULTLINE_ENDPOINT:-}
    volumes:
      - uploads:/app/backend/uploads
    depends_on:
      notes-db:
        condition: service_healthy
    mem_limit: 256m
    cpus: 1.0

volumes:
  pgdata:
  uploads:
